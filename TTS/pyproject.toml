[project]
name = "aven-tts"
version = "0.1.0"
description = "Aven TTS node: WebSocket front for paroli-server (NPU VITS), relays PCM to the LLM node."
requires-python = ">=3.10"
dependencies = [
    "websockets>=13",
    "requests>=2.31",
    "pyyaml>=6",
]

# App-style project: install the deps, but don't try to build this dir as a package.
[tool.uv]
package = false

[project]
name = "aven-ttsv3"
version = "0.1.0"
description = "Aven TTSV3 node: in-process Piper TTS (CPU/onnxruntime), relays PCM to the LLM node."
requires-python = ">=3.10"
dependencies = [
    "websockets>=13",
    "pyyaml>=6",
    "piper-tts>=1.3",
]

# App-style project: install the deps, but don't try to build this dir as a package.
[tool.uv]
package = false

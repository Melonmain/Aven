# Aven — service topology and settings.
#
# This single file is shared by every microservice (LLM orchestrator, TTS node,
# and the connector test client). Each board has the whole repo checked out, so
# every service reads this same file to learn where the others live.
#
# Tailscale IPs:
#   main Rock 5C  (LLM + rkllama)  : 100.108.158.94
#   TTS  Rock 5C  (TTS + paroli)   : 100.113.61.126

services:
  # LLM orchestrator — the endpoint the connector/laptop talks to.
  # Runs on the main Rock 5C. Streams tokens from rkllama and relays clauses
  # to the TTS node, forwarding PCM back to the client.
  llm:
    host: 100.108.158.94
    port: 8765

  # TTS node — runs on the second Rock 5C, fronts paroli-server (NPU).
  tts:
    host: 100.113.61.126
    port: 8766

  # rkllama LLM backend — local to the LLM board (NPU inference, OpenAI API).
  rkllama:
    host: 127.0.0.1
    port: 8080

  # paroli-server TTS backend — local to the TTS board (NPU VITS decoder).
  paroli:
    host: 127.0.0.1
    port: 8848

  # kokoro-server TTS backend (TTSV2, improved Kokoro-82M voice) — local to the
  # TTS board. Same port as paroli; run only one TTS backend at a time.
  kokoro:
    host: 127.0.0.1
    port: 8848

  # STT node — faster-whisper speech-to-text (CPU). The client streams mic audio
  # and gets back a transcript.
  stt:
    host: 100.108.158.94
    port: 8767

# Smart-home devices controllable by the LLM via the set_light tool.
# Tasmota plugs, switched over HTTP (http://<ip>/cm?cmnd=Power%20On|Off).
lights:
  bed: 192.168.188.22
  tv: 192.168.188.29

# Weather tool (WeatherAPI). The API key is NOT stored here — set WEATHERAPI_KEY
# in .env.local (gitignored); start_main_board.sh loads it into the environment.
weather:
  location: Fulda

# Spotify play_music tool. Credentials (SPOTIPY_CLIENT_ID/_SECRET/_REDIRECT_URI)
# live in .env.local, not here. `device` is the Spotify Connect target name,
# which must match LIBRESPOT_NAME in /etc/raspotify/conf.
spotify:
  device: Aven

llm:
  # Which brain answers: "claude" (the installed Claude CLI — better quality,
  # uses your Claude auth, needs internet) or "rkllama" (the local NPU model,
  # fully offline). Toggle here; no other change needed.
  backend: claude
  # Optional model for the claude backend (e.g. claude-haiku-4-5 for snappier
  # voice replies). null = the CLI's default model.
  claude_model: claude-haiku-4-5
  # Local model name as known to rkllama (the trailing segment of the pull path).
  model: qwen2.5-3b
  # Ping rkllama every N minutes so it never unloads the model (rkllama drops it
  # after 30 min idle). Avoids a slow cold reload after long gaps. 0 = disabled.
  keepalive_minutes: 10
  system_prompt: >-
    You are Aven, a voice assistant. Reply briefly in plain spoken sentences for
    text to speech, with no markdown or special symbols. The user's words come
    from imperfect speech-to-text and may be garbled or slightly wrong; infer the
    most likely intended meaning and answer it directly. Do not ask the user to
    repeat or clarify unless the text is completely meaningless.

tts:
  # Native PCM sample rate of the paroli/Piper model (Piper voices are 22050).
  sample_rate: 22050
  # Speaker id for multi-speaker models, or null for single-speaker.
  speaker_id: null
  # Speaking rate: >1 slower, <1 faster, null for the model default.
  length_scale: null

# TTSV2 — kokoro-server backend (improved Kokoro-82M voice). Used by
# TTSV2/voice_server.py, which listens on the same `services.tts` port (8766),
# so the LLM node reaches it the same way. Run either paroli OR kokoro, not both.
ttsv2:
  # Kokoro voice name (list them via GET /api/v1/voices on kokoro-server).
  voice: af_heart
  # Speaking rate: 1.0 normal, >1 faster, <1 slower.
  speed: 1.0
  # Kokoro-82M native PCM rate.
  sample_rate: 24000

# STT — faster-whisper, CPU. Audio in (any rate, resampled to 16 kHz) -> text.
stt:
  # Model name (downloaded from HuggingFace on first use). tiny.en/base.en are
  # the practical CPU choices on a Rock 5C; small.en is slower but more accurate.
  model: small.en      # tiny/base/small/medium .en — bigger = more accurate, slower
  language: en          # null = autodetect
  compute_type: int8    # int8 is fastest on CPU; int8_float32 / float32 also work
  beam_size: 5          # 1 = greedy (fastest); higher is slower but more accurate
  # CTranslate2 worker threads. The RK3588 is big.LITTLE (4x fast A76 + 4x slow
  # A55); 4 threads pinned to the A76 cores beat 8 — adding the slow cores to the
  # GEMM pool stalls the fast threads at the sync barrier. start_main_board.sh
  # pins STT to cores 4-7 (the A76s) with taskset to match.
  cpu_threads: 4
  # Silero VAD trims non-speech inside the clip before transcribing — kills the
  # "made-up words from background noise" hallucinations. Recommended on.
  vad_filter: true
  # Bias decoding toward the words we actually use (names, commands), so it stops
  # guessing phonetically. Keep it short.
  initial_prompt: >-
    Aven. Spotify, play music, stop, pause, resume. Bed light, TV light, lights
    on, lights off. Set a timer. What's the weather in Fulda. What time is it.

# Wakeword — openWakeWord, CPU (ONNX). Listens to the mic and fires on the
# wake phrase, which would then kick off STT -> LLM -> TTS.
wakeword:
  # Pretrained model name shipped by openWakeWord (downloaded on first use).
  # Options include: hey_jarvis, alexa, hey_mycroft, hey_rhasspy, timer, weather.
  model: hey_jarvis
  threshold: 0.5        # detection score (0..1) above which the wake phrase fires

# Coordinator — the full voice loop client (mic -> wakeword -> record -> STT ->
# LLM -> play). Runs on the device with the mic + speakers.
coordinator:
  max_record_seconds: 10.0   # hard safety cap on one utterance
  silence_timeout: 0.6       # stop once this much non-speech follows your words
  min_record_seconds: 0.3    # ignore blips shorter than this
  # End-pointing uses webrtcvad; aggressiveness 0 (lax) .. 3 (strict about
  # calling audio speech). energy_threshold is the fallback if vad is missing.
  vad_aggressiveness: 2
  energy_threshold: 500      # int16 RMS below this counts as silence (fallback)
  # USB mic / speakers: null = system default. Once the USB devices are plugged
  # in, set these to the device index or a unique part of its name. List devices
  # with: cd coordinator && uv run python coordinator.py --list-devices
  input_device: USB Camera   # PS3 Eye mic array (matched by name; 4ch -> mono)
  # null = ALSA "default", which /etc/asound.conf routes to a dmix on the Pebble
  # so the assistant (TTS) and Raspotify (Spotify) can share the speaker.
  output_device: null
  # Hot-plug: when output_device is null, the speaker can be unplugged/replugged
  # freely. This is the ALSA card id of the USB speaker (see /proc/asound/cards);
  # if it's absent the reply is generated but its audio is dropped, no crash.
  speaker_card: V3
  # Keep conversation history across wake-words; reset it once this many seconds
  # pass between two wake-word detections (a new conversation).
  memory_timeout: 60

# TTSV3 — Piper (CPU, in-process via piper-tts; no separate backend, no NPU).
# TTSV3/voice_server.py listens on the same `services.tts` port (8766). The
# sample rate is read from the voice itself. Run only one TTS variant at a time.
ttsv3:
  # Piper voice name; downloaded by setup_piper.sh into TTSV3/voices/.
  voice: en_US-lessac-medium
  # Speaking rate: >1 slower, <1 faster, null = the voice default.
  length_scale: null
  # Speaker id for multi-speaker voices, or null.
  speaker_id: null

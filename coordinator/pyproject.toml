[project]
name = "aven-coordinator"
version = "0.1.0"
description = "Aven coordinator: the full voice loop — mic -> wakeword -> STT -> LLM -> TTS playback."
requires-python = ">=3.10"
dependencies = [
    "openwakeword>=0.6",
    "onnxruntime>=1.16",
    "numpy>=1.26",
    "soxr>=0.5",
    "sounddevice>=0.4",
    "websockets>=13",
    "pyyaml>=6",
    "webrtcvad-wheels>=2.0.14",   # voice-activity detection for end-pointing
]

[tool.uv]
# App-style project: install the deps, but don't try to build this dir as a package.
package = false
# openWakeWord hard-pins tflite-runtime (no cp312 wheel); we use ONNX, so drop it.
override-dependencies = ["tflite-runtime ; python_version < '3'"]

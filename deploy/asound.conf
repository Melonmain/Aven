# Aven: share the Creative Pebble V3 (USB card "V3") between multiple apps
# (coordinator TTS as user 'melon' + Raspotify/librespot as another user) via
# software mixing (dmix). ipc_perm 0666 lets both users attach to the dmix IPC.
pcm.!default {
    type plug
    slave.pcm "aven_mix"
}
pcm.aven_mix {
    type dmix
    ipc_key 3141
    ipc_perm 0666
    slave {
        pcm "hw:V3,0"
        rate 48000
        channels 2
        format S16_LE
        period_size 1024
        buffer_size 8192
    }
}
ctl.!default {
    type hw
    card V3
}

[Service]
# Allow librespot to share the host ALSA dmix IPC (owned by user melon).
PrivateUsers=false
RemoveIPC=false
# Launch librespot with explicit flags instead of /etc/raspotify/conf env vars,
# so it logs in on boot with the cached credentials (written by
# deploy/spotify_device_auth.sh) and registers in the Spotify Web API — no phone,
# survives reboots. --disable-discovery makes it use those credentials directly;
# --system-cache is where credentials.json lives.
ExecStart=
ExecStart=/usr/bin/librespot --name Aven --disable-discovery --backend alsa --device default --cache /var/cache/raspotify --system-cache /var/cache/raspotify --disable-audio-cache
